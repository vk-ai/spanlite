[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spanlite"
version = "0.1.0"
description = "Local-first traces and evals for LLM agents. No cloud. No vendor."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "vk-ai" }]
keywords = ["llm", "agents", "observability", "evaluation", "rag", "pytest"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/vk-ai/spanlite"
Issues = "https://github.com/vk-ai/spanlite/issues"

[project.entry-points.pytest11]
spanlite = "spanlite.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
